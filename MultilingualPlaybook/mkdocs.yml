site_name: Multilingual LLM Playbook

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - navigation.sections
    - content.footnote.tooltips
  palette:
    - scheme: default
      primary: indigo
      accent: blue

nav:
  - Home: index.md
  - Interactive Flowchart: interactive/flowchart.md
  - Playbook:
      - Introduction: chapters/00-introduction.md
      - Evaluation: chapters/01-evaluation.md
      - Translation: chapters/02-translation.md
      - Off-the-shelf LLMs: chapters/03-off-the-shelf.md
      - Fine-tuning LLMs: chapters/04-fine-tuning.md
      - Conclusion: chapters/99-conclusion.md

plugins:
  - search
  - glightbox


markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - admonition
  - toc:
      permalink: true
  - footnotes

extra_javascript:
  - https://unpkg.com/mermaid@10.4.0/dist/mermaid.min.js
