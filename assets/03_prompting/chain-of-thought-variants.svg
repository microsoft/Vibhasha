<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B5FC7"/>
    </marker>
  </defs>
  
  <rect width="900" height="420" rx="12" fill="#F8F9FA"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#242424">Chain-of-thought prompting variants for multilingual tasks</text>

  <!-- Direct -->
  <rect x="30" y="65" width="190" height="160" rx="10" fill="#F0F0F0" stroke="#888" stroke-width="1.5"/>
  <rect x="30" y="65" width="190" height="32" rx="10" fill="#888"/>
  <text x="125" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Direct answer</text>
  <text x="45" y="114" font-size="11" fill="#242424">Q: [Target language]</text>
  <line x1="45" y1="124" x2="200" y2="124" stroke="#ccc" stroke-width="0.5"/>
  <text x="45" y="142" font-size="11" fill="#888">No reasoning steps</text>
  <line x1="45" y1="152" x2="200" y2="152" stroke="#ccc" stroke-width="0.5"/>
  <text x="45" y="170" font-size="11" fill="#242424">A: [Target language]</text>
  <text x="125" y="210" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Baseline — weakest</text>
  
  <!-- Native CoT -->
  <rect x="250" y="65" width="190" height="160" rx="10" fill="#EDFDE6" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="250" y="65" width="190" height="32" rx="10" fill="#16A34A"/>
  <text x="345" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Native-CoT</text>
  <text x="265" y="114" font-size="11" fill="#242424">Q: [Target language]</text>
  <line x1="265" y1="124" x2="420" y2="124" stroke="#C8F5B7" stroke-width="0.5"/>
  <text x="265" y="142" font-size="11" fill="#16A34A">Reasoning: [Target lang]</text>
  <line x1="265" y1="152" x2="420" y2="152" stroke="#C8F5B7" stroke-width="0.5"/>
  <text x="265" y="170" font-size="11" fill="#242424">A: [Target language]</text>
  <text x="345" y="210" text-anchor="middle" font-size="10" fill="#16A34A" font-style="italic">Good — native reasoning</text>

  <!-- En-CoT -->
  <rect x="470" y="65" width="190" height="160" rx="10" fill="#EAEAFF" stroke="#5B5FC7" stroke-width="1.5"/>
  <rect x="470" y="65" width="190" height="32" rx="10" fill="#5B5FC7"/>
  <text x="565" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">En-CoT</text>
  <text x="485" y="114" font-size="11" fill="#242424">Q: [Target language]</text>
  <line x1="485" y1="124" x2="640" y2="124" stroke="#D1D1FF" stroke-width="0.5"/>
  <text x="485" y="142" font-size="11" fill="#5B5FC7">Reasoning: [English]</text>
  <line x1="485" y1="152" x2="640" y2="152" stroke="#D1D1FF" stroke-width="0.5"/>
  <text x="485" y="170" font-size="11" fill="#242424">A: [Target language]</text>
  <text x="565" y="210" text-anchor="middle" font-size="10" fill="#5B5FC7" font-style="italic">Best — English reasoning</text>

  <!-- Cross-Thought -->
  <rect x="690" y="65" width="190" height="160" rx="10" fill="#FFF3E2" stroke="#D97706" stroke-width="1.5"/>
  <rect x="690" y="65" width="190" height="32" rx="10" fill="#D97706"/>
  <text x="785" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Cross-thought</text>
  <text x="705" y="114" font-size="11" fill="#242424">Q: [Target language]</text>
  <line x1="705" y1="124" x2="860" y2="124" stroke="#FFE4BE" stroke-width="0.5"/>
  <text x="705" y="142" font-size="11" fill="#D97706">Rephrase Q → English</text>
  <text x="705" y="158" font-size="11" fill="#D97706">Reasoning: [English]</text>
  <line x1="705" y1="168" x2="860" y2="168" stroke="#FFE4BE" stroke-width="0.5"/>
  <text x="705" y="186" font-size="11" fill="#242424">A: [Target language]</text>
  <text x="785" y="210" text-anchor="middle" font-size="10" fill="#D97706" font-style="italic">Best for complex tasks</text>

  <!-- Performance bar chart -->
  <rect x="30" y="255" width="840" height="145" rx="10" fill="#fff" stroke="#E0E0E0" stroke-width="1"/>
  <text x="450" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#242424">Relative performance (multilingual arithmetic reasoning — MGSM benchmark)</text>
  
  <!-- Bars -->
  <text x="180" y="310" text-anchor="end" font-size="11" fill="#242424">Direct</text>
  <rect x="190" y="296" width="200" height="20" rx="4" fill="#E0E0E0"/>
  <text x="395" y="311" font-size="10" fill="#888">~40%</text>

  <text x="180" y="340" text-anchor="end" font-size="11" fill="#242424">Native-CoT</text>
  <rect x="190" y="326" width="370" height="20" rx="4" fill="#C8F5B7"/>
  <text x="565" y="341" font-size="10" fill="#16A34A">~72%</text>

  <text x="180" y="370" text-anchor="end" font-size="11" fill="#242424">En-CoT</text>
  <rect x="190" y="356" width="420" height="20" rx="4" fill="#D1D1FF"/>
  <text x="615" y="371" font-size="10" fill="#5B5FC7">~80%</text>

  <text x="450" y="400" text-anchor="middle" font-size="10" fill="#888" font-style="italic">Based on findings from Shi et al. (2022) — Language Models are Multilingual Chain-of-Thought Reasoners</text>
</svg>