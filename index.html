<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <!-- Start Single Page App redirect for GitHub Pages -->
    <script>
      (function(){
        // Restore the real URL from the query-string redirect performed by 404.html
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Capture incoming redirect from 404.html
        var loc = window.location;
        if (loc.search[1] === '/') {
          var decoded = loc.search.slice(1).split('&').map(function(s){
            return s.replace(/~and~/g, '&');
          }).join('?');
          var newUrl =
            loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
            loc.pathname + decoded + loc.hash;
          sessionStorage.redirect = newUrl;
          history.replaceState(null, null, newUrl);
        }
      })();
    </script>
    <!-- End Single Page App redirect for GitHub Pages -->
  </head>
  <body>
    <div id="root">
      <noscript>
        This application requires JavaScript to run. Please enable JavaScript in your browser.
      </noscript>
    </div>
    <!-- During development Vite expects the entry at /src/main.jsx -->
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
